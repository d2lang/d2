<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="Compare ELK layout options on real D2 diagrams and recompile the examples in your browser."
    />
    <title>D2 Layout Lab · Merge edges</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231b3e35'/%3E%3Cpath d='M7 16h7m0 0 9-8m-9 8 9 8' fill='none' stroke='%23ffc59c' stroke-width='2'/%3E%3Cg fill='%23ffc59c'%3E%3Ccircle cx='7' cy='16' r='3'/%3E%3Ccircle cx='24' cy='8' r='3'/%3E%3Ccircle cx='24' cy='24' r='3'/%3E%3C/g%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <svg xmlns="http://www.w3.org/2000/svg" class="sprite" aria-hidden="true">
      <symbol id="i-brand" viewBox="0 0 32 32">
        <path d="M6 16h9m0 0 8-9m-8 9 8 9" stroke-width="2" />
        <g fill="currentColor" stroke="none">
          <rect x="3" y="13" width="6" height="6" rx="1.4" />
          <rect x="21" y="4" width="6" height="6" rx="1.4" />
          <rect x="21" y="22" width="6" height="6" rx="1.4" />
        </g>
      </symbol>
      <symbol id="i-out" viewBox="0 0 24 24"><path d="M7 17 17 7M7 7h10v10" /></symbol>
      <symbol id="i-filter" viewBox="0 0 24 24">
        <circle cx="10.8" cy="10.8" r="6.8" />
        <path d="m16 16 4 4" />
      </symbol>
      <symbol id="i-tune" viewBox="0 0 24 24">
        <path d="M4 7h8m4 0h4M4 17h3m4 0h9" />
        <circle cx="14" cy="7" r="2" />
        <circle cx="9" cy="17" r="2" />
      </symbol>
      <symbol id="i-info" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" />
        <path d="M12 11v6m0-11v1" />
      </symbol>
      <symbol id="i-code" viewBox="0 0 24 24"><path d="m8 7-5 5 5 5m8-10 5 5-5 5m-3-13-2 16" /></symbol>
      <symbol id="i-frame" viewBox="0 0 24 24"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5" /></symbol>
      <symbol id="i-save" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M4 17v3h16v-3" /></symbol>
      <symbol id="i-link" viewBox="0 0 24 24">
        <path d="m9 15 6-6m-7 3-1 1a3.5 3.5 0 0 0 5 5l2-2m-4-8 2-2a3.5 3.5 0 0 1 5 5l-1 1" />
      </symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m8 10 4 4 4-4" /></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" /></symbol>
      <symbol id="i-play" viewBox="0 0 24 24">
        <path d="m7 4 12 8-12 8z" fill="currentColor" stroke="none" />
      </symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6" /></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24">
        <rect x="8" y="8" width="12" height="12" rx="2" />
        <path d="M16 8V4H4v12h4" />
      </symbol>
    </svg>
    <a href="#main" class="skip">Skip to comparison</a>
    <header class="top">
      <a href="#merge-edges" class="brand" aria-label="D2 Layout Lab home">
        <svg class="brand-icon" aria-hidden="true"><use href="#i-brand" /></svg>
        <span><b>D2</b> Layout Lab</span>
      </a>
      <div class="toplinks">
        <a href="https://github.com/d2lang/d2/issues/2236" target="_blank" rel="noopener"
          >Issue #2236 <svg class="icon small"><use href="#i-out" /></svg
        ></a>
        <button id="build" type="button">
          <svg class="icon"><use href="#i-info" /></svg> Build details
        </button>
      </div>
    </header>
    <div class="layout">
      <aside class="rail" aria-label="Layout options">
        <div class="rail-fixed">
          <div class="rail-heading">
            <h2>ELK options</h2>
            <span class="total" id="total">14</span>
          </div>
          <label class="search"
            ><svg class="icon"><use href="#i-filter" /></svg
            ><input type="search" id="filter" placeholder="Find an option" aria-label="Find an option" /><kbd
              >/</kbd
            ></label
          >
        </div>
        <nav id="menu" aria-label="Options by topic"></nav>
      </aside>
      <main id="main" tabindex="-1">
        <button type="button" id="browse" class="btn mobile-browse">
          <svg class="icon"><use href="#i-tune" /></svg> Browse options
          <svg class="icon small"><use href="#i-chevron" /></svg>
        </button>
        <section class="intro" aria-labelledby="case-title">
          <div class="metarow">
            <span id="group-name"></span><span class="meta-rule"></span><span>ELK Layered</span>
          </div>
          <h1 id="case-title">Merge edges</h1>
          <p class="description" id="description"></p>
          <div class="keyrow"><code id="option-key"></code></div>
        </section>
        <section class="compare" aria-label="Diagram comparison">
          <div class="compare-toolbar">
            <div class="fixture">
              <svg class="icon"><use href="#i-brand" /></svg><span id="fixture"></span>
            </div>
            <span class="scale-tag" title="Both diagrams use the same number of screen pixels per D2 unit"
              ><svg class="icon small"><use href="#i-link" /></svg> Same scale</span
            >
          </div>
          <div class="panes" id="panes"></div>
        </section>
        <section class="reading" aria-labelledby="reading-title">
          <div class="reading-mark" aria-hidden="true">
            <svg class="icon"><use href="#i-brand" /></svg>
          </div>
          <div>
            <h2 id="reading-title">What to look for</h2>
            <p id="insight"></p>
            <p id="same" hidden></p>
          </div>
        </section>
        <section class="source-section" aria-labelledby="source-title">
          <div class="section-title">
            <div class="title-icon">
              <svg class="icon"><use href="#i-code" /></svg>
            </div>
            <h2 id="source-title">D2 source</h2>
          </div>
          <p class="section-intro">Edit the diagram, then render both values with D2 in your browser.</p>
          <div class="editor">
            <div class="ed-toolbar">
              <span class="filename">example.d2</span
              ><button class="text-button" id="reset" type="button">Restore example</button>
            </div>
            <div class="editor-body">
              <div id="gutter" aria-hidden="true"></div>
              <textarea
                id="editor"
                rows="8"
                spellcheck="false"
                autocapitalize="off"
                autocomplete="off"
                aria-label="Editable D2 diagram source"
              ></textarea>
            </div>
            <div class="target-field" id="target-box" hidden>
              <label for="target">Constrained shape ID</label><input id="target" spellcheck="false" />
            </div>
            <div class="ed-footer">
              <span id="render-status" role="status" aria-live="polite"></span
              ><button type="button" class="primary" id="render">
                <svg class="icon small"><use href="#i-play" /></svg> Render edits
              </button>
            </div>
          </div>
          <div class="support">
            <div>
              <h3>Using this option in D2</h3>
              <p id="availability"></p>
              <code id="cli" hidden></code>
            </div>
            <a id="option-doc" class="doclink" target="_blank" rel="noopener"
              >ELK reference <svg class="icon small"><use href="#i-out" /></svg
            ></a>
          </div>
        </section>
      </main>
    </div>
    <dialog id="dialog" aria-labelledby="dialog-title">
      <div class="dialog-top">
        <h2 id="dialog-title"></h2>
        <button id="dialog-close" class="icon-button" aria-label="Close dialog">
          <svg class="icon"><use href="#i-close" /></svg>
        </button>
      </div>
      <div id="dialog-body"></div>
    </dialog>
    <template id="pane">
      <article class="pane">
        <div class="pane-controls">
          <div class="pane-label"><i></i><label></label></div>
          <div class="choice">
            <select></select
            ><input class="custom" aria-label="Custom option value" hidden />
          </div>
        </div>
        <div class="stage"><div class="diagram-slot"></div></div>
        <div class="pane-foot">
          <div class="measures"><strong class="metric"></strong><span class="bounds"></span></div>
          <div class="pane-actions">
            <button
              type="button"
              class="icon-button input-action"
              title="View full D2 input"
              aria-label="View full D2 input"
            >
              <svg class="icon"><use href="#i-code" /></svg>
            </button>
            <button
              type="button"
              class="icon-button save-action"
              title="Download SVG"
              aria-label="Download SVG"
            >
              <svg class="icon"><use href="#i-save" /></svg>
            </button>
            <button
              type="button"
              class="icon-button expand-action"
              title="Expand diagram"
              aria-label="Expand diagram"
            >
              <svg class="icon"><use href="#i-frame" /></svg>
            </button>
          </div>
        </div>
      </article>
    </template>
    <script type="module" src="./app.js"></script>
  </body>
</html>
