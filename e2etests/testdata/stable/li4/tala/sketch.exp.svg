F25" font-size="16" xml:space="preserve">1.</text><text x="32" y="58" class="md-text text fill-N1" fill="#0A0F25" font-size="16" xml:space="preserve">This is a list item with two paragraphs. Lorem ipsum dolor sit amet, consectetuer adipiscing elit. Aliquam hendrerit mi posuere lectus.</text><text x="32" y="98" class="md-text text fill-N1" fill="#0A0F25" font-size="16" xml:space="preserve">Vestibulum enim wisi, viverra nec, fringilla in, laoreet vitae, risus. Donec sit amet nisl. Aliquam semper ipsum sit amet velit.</text><text x="16.859" y="138" class="md-text text fill-N1" fill="#0A0F25" font-size="16" xml:space="preserve">2.</text><text x="32" y="138" class="md-text text fill-N1" fill="#0A0F25" font-size="16" xml:space="preserve">Suspendisse id sem consectetuer libero luctus adipiscing.</text><text x="0" y="178" class="md-text text fill-N1" fill="#0A0F25" font-size="16" xml:space="preserve">It looks nice if you indent every line of the subsequent paragraphs, but here again, Markdown will allow you to be lazy:</text><rect x="15" y="211" width="5" height="5" rx="2.5" class="fill-N1" fill="#0A0F25"/><text x="32" y="218" class="md-text text fill-N1" fill="#0A0F25" font-size="16" xml:space="preserve">This is a list item with two paragraphs.</text><rect x="32" y="240" width="888" height="51.72" rx="6" class="fill-N6" fill="#EEF1F8"/><text x="48" y="270.36" class="md-text text-mono fill-N1" fill="#0A0F25" font-size="13.6" xml:space="preserve">This is the second paragraph in the list item. You&#39;re</text><text x="32" y="325.72" class="md-text text fill-N1" fill="#0A0F25" font-size="16" xml:space="preserve">only required to indent the first line. Lorem ipsum dolor sit amet, consectetuer adipiscing elit.</text><rect x="15" y="358.72" width="5" height="5" rx="2.5" class="fill-N1" fill="#0A0F25"/><text x="32" y="365.72" class="md-text text fill-N1" fill="#0A0F25" font-size="16" xml:space="preserve">Another item in the same list.</text></g></svg></g><g class="YQ=="><g class="shape"><rect x="434" y="0" width="53" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;"/></g><text x="460.5" y="38.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">a</text></g><g class="Yg=="><g class="shape"><rect x="434" y="640" width="53" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;"/></g><text x="460.5" y="678.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">b</text></g><g class="KGEgLSZndDsgbWQpWzBd"><marker id="mk-2911201332-1low1sm_" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2"/></marker><path d="M 460 68 L 460 161" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-2911201332-1low1sm_)" mask="url(#d2-2911201332)"/></g><g class="KG1kIC0mZ3Q7IGIpWzBd"><path d="M 460 543 L 460 636" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-2911201332-1low1sm_)" mask="url(#d2-2911201332)"/></g><mask id="d2-2911201332" maskUnits="userSpaceOnUse" x="-1" y="-1" width="922" height="708"><rect x="-1" y="-1" width="922" height="708" fill="white"/></mask></svg></svg>