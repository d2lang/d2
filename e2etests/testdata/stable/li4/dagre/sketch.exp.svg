		.d2-95635950 .stroke-B2{stroke:#0D32B2;}.appendix text.text{fill:#0A0F25}.md{--color-fg-default:#0A0F25;--color-fg-muted:#676C7E;--color-fg-subtle:#9499AB;--color-canvas-default:#FFFFFF;--color-canvas-subtle:#EEF1F8;--color-border-default:#0D32B2;--color-border-muted:#0D32B2;--color-neutral-muted:#EEF1F8;--color-accent-fg:#0D32B2;--color-accent-emphasis:#0D32B2;--color-attention-subtle:#676C7E;--color-danger-fg:red;}.light-code{display: block}.dark-code{display: none}]]></style><g class="bWQ="><g class="shape" ></g><svg x="0" y="166" width="920" height="376" viewBox="0 0 920 376" overflow="hidden"><g class="md md-native"><text x="0.000" y="18.000" class="md-text text fill-N1" fill="#0A0F25" font-size="16.000" xml:space="preserve">List items may consist of multiple paragraphs. Each subsequent paragraph in a list item must be indented by either 4 spaces or one tab:</text><text x="16.859" y="58.000" class="md-text text fill-N1" fill="#0A0F25" font-size="16.000" xml:space="preserve">1.</text><text x="32.000" y="58.000" class="md-text text fill-N1" fill="#0A0F25" font-size="16.000" xml:space="preserve">This is a list item with two paragraphs. Lorem ipsum dolor sit amet, consectetuer adipiscing elit. Aliquam hendrerit mi posuere lectus.</text><text x="32.000" y="98.000" class="md-text text fill-N1" fill="#0A0F25" font-size="16.000" xml:space="preserve">Vestibulum enim wisi, viverra nec, fringilla in, laoreet vitae, risus. Donec sit amet nisl. Aliquam semper ipsum sit amet velit.</text><text x="16.859" y="138.000" class="md-text text fill-N1" fill="#0A0F25" font-size="16.000" xml:space="preserve">2.</text><text x="32.000" y="138.000" class="md-text text fill-N1" fill="#0A0F25" font-size="16.000" xml:space="preserve">Suspendisse id sem consectetuer libero luctus adipiscing.</text><text x="0.000" y="178.000" class="md-text text fill-N1" fill="#0A0F25" font-size="16.000" xml:space="preserve">It looks nice if you indent every line of the subsequent paragraphs, but here again, Markdown will allow you to be lazy:</text><rect x="15.000" y="211.000" width="5.000" height="5.000" rx="2.500" class="fill-N1" fill="#0A0F25"/><text x="32.000" y="218.000" class="md-text text fill-N1" fill="#0A0F25" font-size="16.000" xml:space="preserve">This is a list item with two paragraphs.</text><rect x="32.000" y="240.000" width="888.000" height="51.720" rx="6.000" class="fill-N6" fill="#EEF1F8"/><text x="48.000" y="270.360" class="md-text text-mono fill-N1" fill="#0A0F25" font-size="13.600" xml:space="preserve">This is the second paragraph in the list item. You&#39;re</text><text x="32.000" y="325.720" class="md-text text fill-N1" fill="#0A0F25" font-size="16.000" xml:space="preserve">only required to indent the first line. Lorem ipsum dolor sit amet, consectetuer adipiscing elit.</text><rect x="15.000" y="358.720" width="5.000" height="5.000" rx="2.500" class="fill-N1" fill="#0A0F25"/><text x="32.000" y="365.720" class="md-text text fill-N1" fill="#0A0F25" font-size="16.000" xml:space="preserve">Another item in the same list.</text></g></svg></g><g class="YQ=="><g class="shape" ><rect x="434" y="0" width="53" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="460.5" y="38.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">a</text></g><g class="Yg=="><g class="shape" ><rect x="434" y="642" width="53" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="460.5" y="680.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">b</text></g><g class="KGEgLSZndDsgbWQpWzBd"><marker id="mk-d2-95635950-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 460 68 C 460 106 460 126 460 162" stroke="#0D32B2"