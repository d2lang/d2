		.d2-1525902989 .stroke-B2{stroke:#0D32B2;}.appendix text.text{fill:#0A0F25}.md{--color-fg-default:#0A0F25;--color-fg-muted:#676C7E;--color-fg-subtle:#9499AB;--color-canvas-default:#FFFFFF;--color-canvas-subtle:#EEF1F8;--color-border-default:#0D32B2;--color-border-muted:#0D32B2;--color-neutral-muted:#EEF1F8;--color-accent-fg:#0D32B2;--color-accent-emphasis:#0D32B2;--color-attention-subtle:#676C7E;--color-danger-fg:red;}.light-code{display: block}.dark-code{display: none}]]></style><g class="YQ=="><g class="shape" ><rect x="297" y="0" width="428" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="511" y="38.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="511" dy="0">有一个叫做夏天的季节。</tspan><tspan x="511" dy="17.666667"> ある季節、夏という名前がついています。</tspan><tspan x="511" dy="17.666667">한 계절, 여름이란 이름이 있습니다.</tspan></text></g><g class="Yg=="><g class="shape" ><rect x="552" y="198" width="448" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="776" y="236.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">夏天的时候，天气非常热，人们总是流着汗。</text></g><g class="Yw=="><g class="shape" ></g><svg x="0" y="199" width="492" height="64" viewBox="0 0 492 64" overflow="hidden"><g class="md md-native"><text x="0.000" y="18.000" class="md-text text fill-N1" fill="#0A0F25" font-size="16.000" xml:space="preserve">夏になると、とても暑くて、人々は汗を流しています。</text><text x="0.000" y="58.000" class="md-text text fill-N1" fill="#0A0F25" font-size="16.000" xml:space="preserve">여름에는 매우 더워서 사람들은 땀을 흘립니다.</text></g></svg></g><g class="KGEgLSZndDsgYilbMF0="><marker id="mk-d2-1525902989-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 643.873805 98.699