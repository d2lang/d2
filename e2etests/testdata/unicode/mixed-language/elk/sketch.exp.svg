		.d2-40175756 .stroke-B2{stroke:#0D32B2;}.appendix text.text{fill:#0A0F25}.md{--color-fg-default:#0A0F25;--color-fg-muted:#676C7E;--color-fg-subtle:#9499AB;--color-canvas-default:#FFFFFF;--color-canvas-subtle:#EEF1F8;--color-border-default:#0D32B2;--color-border-muted:#0D32B2;--color-neutral-muted:#EEF1F8;--color-accent-fg:#0D32B2;--color-accent-emphasis:#0D32B2;--color-attention-subtle:#676C7E;--color-danger-fg:red;}]]></style><g class="YQ=="><g class="shape" ><rect x="267" y="12" width="428" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="481" y="50.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="481" dy="0">有一个叫做夏天的季节。</tspan><tspan x="481" dy="17.666667"> ある季節、夏という名前がついています。</tspan><tspan x="481" dy="17.666667">한 계절, 여름이란 이름이 있습니다.</tspan></text></g><g class="Yg=="><g class="shape" ><rect x="12" y="190" width="448" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="236" y="228.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">夏天的时候，天气非常热，人们总是流着汗。</text></g><g class="Yw=="><g class="shape" ></g><svg x="480" y="190" width="492" height="64" viewBox="0 0 492 64" overflow="hidden"><g class="md md-native"><text x="0.000" y="18.000" class="md-text text fill-N1" fill="#0A0F25" font-size="16.000" xml:space="preserve">夏になると、とても暑くて、人々は汗を流しています。</text><text x="0.000" y="58.000" class="md-text text fill-N1" fill="#0A0F25" font-size="16.000" xml:space="preserve">여름에는 매우 더워서 사람들은 땀을 흘립니다.</text></g></svg></g><g class="KGEgLSZndDsgYilbMF0="><marker id="mk-d2-40175756-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 409.665985 112 L 409.665985 186" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-40175756-3488378134)" mask="url(#d2-40175756)" /></g><g class="KGEgLSZndDsgYylbMF0="><path d="M 552.333008 112 L 552.333008 186" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-40175756-3488378134)" mask="url(#d2-40175756)" /></g><mask id="d2-40175756" maskUnits="userSpaceOnUse" x="11" y="11" width="962" height="246"><rect x="11" y="11" width="962" height="246" fill="white"/></mask></svg></svg>