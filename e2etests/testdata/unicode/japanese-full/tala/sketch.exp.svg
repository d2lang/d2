<?xml version="1.0" encoding="utf-8"?><svg xmlns="http://www.w3.org/2000/svg" data-d2-version="v0.8.1-HEAD" preserveAspectRatio="xMinYMin meet" viewBox="0 0 1384 365"><svg class="d2-3411007838 d2-svg" width="1384" height="365" viewBox="-1 -1 1384 365"><rect x="-1" y="-1" width="1384" height="365" fill="#FFFFFF" class=" fill-N7" stroke-width="0"/><style>.d2-3411007838 .text-bold{font-family:d2-3411007838-font-bold}@font-face{font-family:d2-3411007838-font-bold;src:url(data:font/woff2;base64,)}.d2-3411007838 .text-italic{font-family:d2-3411007838-font-italic}@font-face{font-family:d2-3411007838-font-italic;src:url(data:font/woff2;base64,)}.shape{shape-rendering:geometricPrecision;stroke-linejoin:round}.connection{stroke-linecap:round;stroke-linejoin:round}.d2-3411007838 .fill-N1{fill:#0A0F25}.d2-3411007838 .fill-N2{fill:#676C7E}.d2-3411007838 .fill-N7{fill:#FFFFFF}.d2-3411007838 .fill-B1{fill:#0D32B2}.d2-3411007838 .fill-B6{fill:#F7F8FE}.d2-3411007838 .stroke-B1{stroke:#0D32B2}.d2-3411007838 .stroke-B2{stroke:#0D32B2}.appendix text.text{fill:#0A0F25}</style><g class="YQ=="><g class="shape"><rect x="0" y="0" width="1382" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;"/></g><text x="691" y="38.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="691" dy="0">ある日、トマトが道を歩いていたら、道路の向こうからキュウリがやって来ました。</tspan><tspan x="691" dy="17.666667">トマトは驚いて尋ねました。</tspan><tspan x="691" dy="17.666667">「キュウリさん、どうしてあなたはここにいるのですか？」 キュウリは答えました。「あなたと同じ理由でここにいます。サラダになるために。」</tspan></text></g><g class="Yg=="><g class="shape"><rect x="8" y="248" width="1367" height="115" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;"/></g><text x="691.5" y="325.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:55px">「バナナは皮を剥いて食べるものです。」</text></g><g class="KGEgLSZndDsgYilbMF0="><marker id="mk-3411007838-1low1sm_" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2"/></marker><path d="M 691 100 L 691 244" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-3411007838-1low1sm_)" mask="url(#d2-3411007838)"/><text x="841.5" y="179" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">「バカは死ななきゃ治らない。」</text></g><mask id="d2-3411007838" maskUnits="userSpaceOnUse" x="-1" y="-1" width="1384" height="365"><rect x="-1" y="-1" width="1384" height="365" fill="white"/><rect x="695" y="163" width="293" height="21" fill="rgba(0,0,0,0.75)"/></mask></svg></svg>