name: Publish Docker release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published D2 release tag to publish to Docker Hub
        required: true
        type: string
      publish_latest:
        description: Also update latest (stable releases only)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docker-production-release
  cancel-in-progress: false

env:
  PRIMARY_DOCKER_IMAGE: d2lang/d2
  LEGACY_DOCKER_IMAGE: terrastruct/d2

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release: ${{ steps.release.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: ci/release/docker
      - name: Validate protected master dispatch and published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_LATEST: ${{ inputs.publish_latest }}
          REF_PROTECTED: ${{ github.ref_protected }}
          VERSION: ${{ inputs.version }}
        run: ./ci/release/docker/release.sh validate

  preflight:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: docker-release
    env:
      RELEASE: ${{ needs.validate.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: ci/release/docker
      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" && test -n "$DOCKERHUB_TOKEN"
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
      - name: Verify immutability and refuse existing version tags in both repositories
        run: ./ci/release/docker/release.sh preflight
      - name: Clean up Docker credentials
        if: always()
        run: docker logout >/dev/null 2>&1 || true

  build:
    needs: [validate, preflight]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    environment: docker-release
    env:
      ARCH: ${{ matrix.arch }}
      RELEASE: ${{ needs.validate.outputs.release }}
      VERSION: ${{ fromJSON(needs.validate.outputs.release).version }}
    steps:
      # Run the reviewed orchestration from the dispatch, including for older releases.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: ci/release/docker
      - name: Check out the exact release Dockerfile and entrypoint
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(needs.validate.outputs.release).commit }}
          path: release-source
          persist-credentials: false
          sparse-checkout: |
            ci/release/docker
            d2layouts/d2talalayout
      - name: Download and verify exact release archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./ci/release/docker/release.sh download "$ARCH" "$RUNNER_TEMP/docker-context" release-source/ci/release/docker
      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" && test -n "$DOCKERHUB_TOKEN"
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
      - name: Build once and stage identical digests in both repositories with provenance
        id: image
        run: ./ci/release/docker/image.sh build push "$RUNNER_TEMP/docker-context"
      - name: Smoke-test staged CLI, SVG, TALA, and PNG natively
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          # Older release archives predate bundled TALA. Check the pinned source,
          # so a missing TALA binary in a native release cannot silently skip smoke.
          REQUIRE_TALA: ${{ hashFiles('release-source/d2layouts/d2talalayout/layout.go') != '' }}
        run: ./ci/release/docker/image.sh smoke "$IMAGE"
      - name: Record verified architecture digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s\n' "$DIGEST" >"$RUNNER_TEMP/digests/$ARCH.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 7
      - name: Clean up Docker credentials
        if: always()
        run: docker logout >/dev/null 2>&1 || true

  publish-version:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: docker-release
    env:
      RELEASE: ${{ needs.validate.outputs.release }}
    outputs:
      digest: ${{ steps.version.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: ci/release/docker
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: docker-digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" && test -n "$DOCKERHUB_TOKEN"
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
      - name: Revalidate release and candidates, then publish and verify immutable version tags
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./ci/release/docker/release.sh publish-version "$RUNNER_TEMP/digests"
      - name: Clean up Docker credentials
        if: always()
        run: docker logout >/dev/null 2>&1 || true

  publish-latest:
    if: inputs.publish_latest
    needs: [validate, publish-version]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: docker-release
    env:
      RELEASE: ${{ needs.validate.outputs.release }}
      VERSION_DIGEST: ${{ needs.publish-version.outputs.digest }}
      PUBLISH_LATEST: ${{ inputs.publish_latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: ci/release/docker
      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" && test -n "$DOCKERHUB_TOKEN"
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
      - name: Revalidate stable release, then publish and verify latest in both repositories
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./ci/release/docker/release.sh publish-latest
      - name: Clean up Docker credentials
        if: always()
        run: docker logout >/dev/null 2>&1 || true
