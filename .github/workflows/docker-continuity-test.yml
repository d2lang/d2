name: Docker continuity test

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing published D2 release tag to rebuild
        required: true
        type: string
        default: v0.7.1

permissions:
  contents: read

env:
  PRIMARY_DOCKER_IMAGE: d2lang/d2
  LEGACY_DOCKER_IMAGE: terrastruct/d2

concurrency:
  group: docker-continuity-test
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Validate published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if ! printf '%s\n' "$VERSION" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$'; then
            echo "version must be a v-prefixed semantic version" >&2
            exit 1
          fi

          release_json=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$VERSION")
          if [ "$(printf '%s' "$release_json" | jq -r '.draft')" != false ]; then
            echo "$VERSION is a draft release" >&2
            exit 1
          fi
          if [ "$(printf '%s' "$release_json" | jq -r '.published_at')" = null ]; then
            echo "$VERSION has not been published" >&2
            exit 1
          fi
          if [ "$(printf '%s' "$release_json" | jq -r '.tag_name')" != "$VERSION" ]; then
            echo "release tag does not match $VERSION" >&2
            exit 1
          fi

          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" >/dev/null
          for arch in amd64 arm64; do
            asset="d2-$VERSION-linux-$arch.tar.gz"
            if ! printf '%s' "$release_json" | jq -e --arg asset "$asset" \
              'any(.assets[]; .name == $asset)' >/dev/null; then
              echo "$VERSION does not contain $asset" >&2
              exit 1
            fi
          done

          echo "version=$VERSION" >>"$GITHUB_OUTPUT"

  build-amd64:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: docker-release
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      PLATFORM: linux/amd64
      ARCH: amd64
      VERSION: ${{ needs.validate.outputs.version }}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.version }}
          persist-credentials: false

      - name: Check out continuity tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .continuity-source
          persist-credentials: false

      - name: Download release archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset="d2-$VERSION-linux-$ARCH.tar.gz"
          mkdir -p "$RUNNER_TEMP/docker-context"
          gh release download "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$asset" \
            --dir "$RUNNER_TEMP/docker-context"
          tar -tzf "$RUNNER_TEMP/docker-context/$asset" >/dev/null
          cp ci/release/docker/entrypoint.sh "$RUNNER_TEMP/docker-context/entrypoint.sh"
          bash .continuity-source/ci/release/docker/prepare-continuity-dockerfile.sh \
            "$VERSION" \
            ci/release/docker/Dockerfile \
            "$RUNNER_TEMP/Dockerfile"

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$DOCKERHUB_USERNAME"
          test -n "$DOCKERHUB_TOKEN"
          printf '%s' "$DOCKERHUB_TOKEN" | \
            docker login --username "$DOCKERHUB_USERNAME" --password-stdin

      - name: Build and push by digest
        id: build
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/build-metadata.json"
          output="type=image,\"name=$PRIMARY_DOCKER_IMAGE,$LEGACY_DOCKER_IMAGE\",push-by-digest=true,name-canonical=true,push=true"

          docker buildx create --name d2-continuity --driver docker-container --use
          docker buildx inspect --bootstrap
          docker buildx build \
            --platform "$PLATFORM" \
            --provenance=true \
            --output "$output" \
            --metadata-file "$metadata" \
            --file "$RUNNER_TEMP/Dockerfile" \
            "$RUNNER_TEMP/docker-context"

          digest=$(jq -er '."containerimage.digest"' "$metadata")
          if ! printf '%s\n' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "build did not return a valid image digest" >&2
            exit 1
          fi
          docker buildx rm d2-continuity
          echo "digest=$digest" >>"$GITHUB_OUTPUT"

      - name: Verify both image digests and provenance
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          primary_manifest="$RUNNER_TEMP/primary-$ARCH-manifest.json"
          legacy_manifest="$RUNNER_TEMP/legacy-$ARCH-manifest.json"

          docker buildx imagetools inspect --raw \
            "$PRIMARY_DOCKER_IMAGE@$DIGEST" >"$primary_manifest"
          docker buildx imagetools inspect --raw \
            "$LEGACY_DOCKER_IMAGE@$DIGEST" >"$legacy_manifest"

          for image in "$PRIMARY_DOCKER_IMAGE" "$LEGACY_DOCKER_IMAGE"; do
            resolved_digest=$(docker buildx imagetools inspect \
              --format '{{json .Manifest.Digest}}' \
              "$image@$DIGEST" | jq -er .)
            if [[ "$resolved_digest" != "$DIGEST" ]]; then
              echo "$image did not resolve to the build digest" >&2
              exit 1
            fi
          done

          for manifest in "$primary_manifest" "$legacy_manifest"; do
            jq -e --arg arch "$ARCH" '
              def runtime:
                .platform.os == "linux" and .platform.architecture == $arch;
              def attestation:
                .platform.os == "unknown" and
                .platform.architecture == "unknown" and
                .annotations["vnd.docker.reference.type"] == "attestation-manifest";
              .schemaVersion == 2 and
              (.manifests | type == "array") and
              ([.manifests[] | select(runtime)] | length == 1) and
              ([.manifests[] | select(attestation)] | length == 1) and
              (.manifests | length == 2) and
              ([.manifests[] | select(runtime) | .digest] ==
               [.manifests[] | select(attestation) |
                 .annotations["vnd.docker.reference.digest"]])
            ' "$manifest" >/dev/null
          done

          if ! cmp -s "$primary_manifest" "$legacy_manifest"; then
            diff -u \
              <(jq -S . "$primary_manifest") \
              <(jq -S . "$legacy_manifest") || true
            echo "primary and legacy architecture manifests differ" >&2
            exit 1
          fi

          smoke="$RUNNER_TEMP/smoke"
          mkdir -p "$smoke"
          printf 'x -> y\n' >"$smoke/input.d2"

          for image in "$PRIMARY_DOCKER_IMAGE" "$LEGACY_DOCKER_IMAGE"; do
            ref="$image@$DIGEST"
            version_output=$(docker run --rm --platform "$PLATFORM" "$ref" --version)
            printf '%s\n' "$version_output"
            printf '%s\n' "$version_output" | grep -F "$VERSION"

            docker run --rm --platform "$PLATFORM" \
              -u "$(id -u):$(id -g)" \
              -v "$smoke:/home/debian/src" \
              "$ref" input.d2 output.svg
            test -s "$smoke/output.svg"
            grep -q '<svg' "$smoke/output.svg"

            docker run --rm --platform "$PLATFORM" \
              -u "$(id -u):$(id -g)" \
              -v "$smoke:/home/debian/src" \
              "$ref" input.d2 output.png
            test -s "$smoke/output.png"
            test "$(od -An -tx1 -N8 "$smoke/output.png" | tr -d ' \n')" = 89504e470d0a1a0a
          done

      - name: Clean up Docker credentials
        if: always()
        run: |
          docker logout >/dev/null 2>&1 || true
          docker buildx rm d2-continuity >/dev/null 2>&1 || true

  build-arm64:
    needs: validate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    environment: docker-release
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      PLATFORM: linux/arm64
      ARCH: arm64
      VERSION: ${{ needs.validate.outputs.version }}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.version }}
          persist-credentials: false

      - name: Check out continuity tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .continuity-source
          persist-credentials: false

      - name: Download release archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset="d2-$VERSION-linux-$ARCH.tar.gz"
          mkdir -p "$RUNNER_TEMP/docker-context"
          gh release download "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$asset" \
            --dir "$RUNNER_TEMP/docker-context"
          tar -tzf "$RUNNER_TEMP/docker-context/$asset" >/dev/null
          cp ci/release/docker/entrypoint.sh "$RUNNER_TEMP/docker-context/entrypoint.sh"
          bash .continuity-source/ci/release/docker/prepare-continuity-dockerfile.sh \
            "$VERSION" \
            ci/release/docker/Dockerfile \
            "$RUNNER_TEMP/Dockerfile"

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$DOCKERHUB_USERNAME"
          test -n "$DOCKERHUB_TOKEN"
          printf '%s' "$DOCKERHUB_TOKEN" | \
            docker login --username "$DOCKERHUB_USERNAME" --password-stdin

      - name: Build and push by digest
        id: build
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/build-metadata.json"
          output="type=image,\"name=$PRIMARY_DOCKER_IMAGE,$LEGACY_DOCKER_IMAGE\",push-by-digest=true,name-canonical=true,push=true"

          docker buildx create --name d2-continuity --driver docker-container --use
          docker buildx inspect --bootstrap
          docker buildx build \
            --platform "$PLATFORM" \
            --provenance=true \
            --output "$output" \
            --metadata-file "$metadata" \
            --file "$RUNNER_TEMP/Dockerfile" \
            "$RUNNER_TEMP/docker-context"

          digest=$(jq -er '."containerimage.digest"' "$metadata")
          if ! printf '%s\n' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "build did not return a valid image digest" >&2
            exit 1
          fi
          docker buildx rm d2-continuity
          echo "digest=$digest" >>"$GITHUB_OUTPUT"

      - name: Verify both image digests and provenance
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          primary_manifest="$RUNNER_TEMP/primary-$ARCH-manifest.json"
          legacy_manifest="$RUNNER_TEMP/legacy-$ARCH-manifest.json"

          docker buildx imagetools inspect --raw \
            "$PRIMARY_DOCKER_IMAGE@$DIGEST" >"$primary_manifest"
          docker buildx imagetools inspect --raw \
            "$LEGACY_DOCKER_IMAGE@$DIGEST" >"$legacy_manifest"

          for image in "$PRIMARY_DOCKER_IMAGE" "$LEGACY_DOCKER_IMAGE"; do
            resolved_digest=$(docker buildx imagetools inspect \
              --format '{{json .Manifest.Digest}}' \
              "$image@$DIGEST" | jq -er .)
            if [[ "$resolved_digest" != "$DIGEST" ]]; then
              echo "$image did not resolve to the build digest" >&2
              exit 1
            fi
          done

          for manifest in "$primary_manifest" "$legacy_manifest"; do
            jq -e --arg arch "$ARCH" '
              def runtime:
                .platform.os == "linux" and .platform.architecture == $arch;
              def attestation:
                .platform.os == "unknown" and
                .platform.architecture == "unknown" and
                .annotations["vnd.docker.reference.type"] == "attestation-manifest";
              .schemaVersion == 2 and
              (.manifests | type == "array") and
              ([.manifests[] | select(runtime)] | length == 1) and
              ([.manifests[] | select(attestation)] | length == 1) and
              (.manifests | length == 2) and
              ([.manifests[] | select(runtime) | .digest] ==
               [.manifests[] | select(attestation) |
                 .annotations["vnd.docker.reference.digest"]])
            ' "$manifest" >/dev/null
          done

          if ! cmp -s "$primary_manifest" "$legacy_manifest"; then
            diff -u \
              <(jq -S . "$primary_manifest") \
              <(jq -S . "$legacy_manifest") || true
            echo "primary and legacy architecture manifests differ" >&2
            exit 1
          fi

          smoke="$RUNNER_TEMP/smoke"
          mkdir -p "$smoke"
          printf 'x -> y\n' >"$smoke/input.d2"

          for image in "$PRIMARY_DOCKER_IMAGE" "$LEGACY_DOCKER_IMAGE"; do
            ref="$image@$DIGEST"
            version_output=$(docker run --rm --platform "$PLATFORM" "$ref" --version)
            printf '%s\n' "$version_output"
            printf '%s\n' "$version_output" | grep -F "$VERSION"

            docker run --rm --platform "$PLATFORM" \
              -u "$(id -u):$(id -g)" \
              -v "$smoke:/home/debian/src" \
              "$ref" input.d2 output.svg
            test -s "$smoke/output.svg"
            grep -q '<svg' "$smoke/output.svg"

            docker run --rm --platform "$PLATFORM" \
              -u "$(id -u):$(id -g)" \
              -v "$smoke:/home/debian/src" \
              "$ref" input.d2 output.png
            test -s "$smoke/output.png"
            test "$(od -An -tx1 -N8 "$smoke/output.png" | tr -d ' \n')" = 89504e470d0a1a0a
          done

      - name: Clean up Docker credentials
        if: always()
        run: |
          docker logout >/dev/null 2>&1 || true
          docker buildx rm d2-continuity >/dev/null 2>&1 || true

  combine:
    needs: [validate, build-amd64, build-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: docker-release
    env:
      AMD64_DIGEST: ${{ needs.build-amd64.outputs.digest }}
      ARM64_DIGEST: ${{ needs.build-arm64.outputs.digest }}
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      STAGE_TAG: continuity-test-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Log in to Docker Hub
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$DOCKERHUB_USERNAME"
          test -n "$DOCKERHUB_TOKEN"
          printf '%s' "$DOCKERHUB_TOKEN" | \
            docker login --username "$DOCKERHUB_USERNAME" --password-stdin

      - name: Create and verify both continuity-test manifests
        run: |
          set -euo pipefail
          primary_manifest="$RUNNER_TEMP/primary-manifest.json"
          legacy_manifest="$RUNNER_TEMP/legacy-manifest.json"

          for digest in "$AMD64_DIGEST" "$ARM64_DIGEST"; do
            if ! printf '%s\n' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
              echo "invalid architecture digest" >&2
              exit 1
            fi
          done

          for image in "$PRIMARY_DOCKER_IMAGE" "$LEGACY_DOCKER_IMAGE"; do
            docker buildx imagetools create \
              --tag "$image:$STAGE_TAG" \
              "$image@$AMD64_DIGEST" \
              "$image@$ARM64_DIGEST"
          done

          docker buildx imagetools inspect --raw \
            "$PRIMARY_DOCKER_IMAGE:$STAGE_TAG" >"$primary_manifest"
          docker buildx imagetools inspect --raw \
            "$LEGACY_DOCKER_IMAGE:$STAGE_TAG" >"$legacy_manifest"

          for manifest in "$primary_manifest" "$legacy_manifest"; do
            jq -e '
              def runtime:
                .platform.os == "linux" and
                (.platform.architecture == "amd64" or .platform.architecture == "arm64");
              def attestation:
                .platform.os == "unknown" and
                .platform.architecture == "unknown" and
                .annotations["vnd.docker.reference.type"] == "attestation-manifest";
              .schemaVersion == 2 and
              (.manifests | type == "array") and
              ([.manifests[] | select(runtime)] | length == 2) and
              ([.manifests[] | select(runtime and .platform.architecture == "amd64")] | length == 1) and
              ([.manifests[] | select(runtime and .platform.architecture == "arm64")] | length == 1) and
              ([.manifests[] | select(attestation)] | length == 2) and
              (.manifests | length == 4) and
              (([.manifests[] | select(runtime) | .digest] | sort) ==
               ([.manifests[] | select(attestation) |
                 .annotations["vnd.docker.reference.digest"]] | sort))
            ' "$manifest" >/dev/null
          done

          if ! cmp -s "$primary_manifest" "$legacy_manifest"; then
            diff -u \
              <(jq -S . "$primary_manifest") \
              <(jq -S . "$legacy_manifest") || true
            echo "primary and legacy multi-platform manifests differ" >&2
            exit 1
          fi

          primary_digest=$(docker buildx imagetools inspect \
            --format '{{json .Manifest.Digest}}' \
            "$PRIMARY_DOCKER_IMAGE:$STAGE_TAG" | jq -er .)
          legacy_digest=$(docker buildx imagetools inspect \
            --format '{{json .Manifest.Digest}}' \
            "$LEGACY_DOCKER_IMAGE:$STAGE_TAG" | jq -er .)
          for digest in "$primary_digest" "$legacy_digest"; do
            if ! printf '%s\n' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
              echo "combined manifest does not have a valid digest" >&2
              exit 1
            fi
          done
          if [[ "$primary_digest" != "$legacy_digest" ]]; then
            echo "primary and legacy multi-platform manifest digests differ" >&2
            exit 1
          fi

          docker buildx imagetools inspect "$PRIMARY_DOCKER_IMAGE:$STAGE_TAG"
          docker buildx imagetools inspect "$LEGACY_DOCKER_IMAGE:$STAGE_TAG"

          {
            echo "Published and verified matching continuity manifests:"
            echo
            echo "- \`$PRIMARY_DOCKER_IMAGE:$STAGE_TAG\`"
            echo "- \`$LEGACY_DOCKER_IMAGE:$STAGE_TAG\`"
            echo "- digest: \`$primary_digest\`"
            echo
            echo "The cleanup step removes both ephemeral tags with their namespace-owner credentials."
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Delete both continuity-test tags
        if: always()
        env:
          DOCKERHUB_D2LANG_DELETE_TOKEN: ${{ secrets.DOCKERHUB_D2LANG_DELETE_TOKEN }}
          DOCKERHUB_TERRASTRUCT_DELETE_TOKEN: ${{ secrets.DOCKERHUB_TERRASTRUCT_DELETE_TOKEN }}
        run: |
          set -uo pipefail

          if [[ "$PRIMARY_DOCKER_IMAGE" != d2lang/d2 ||
            "$LEGACY_DOCKER_IMAGE" != terrastruct/d2 ||
            ! "$STAGE_TAG" =~ ^continuity-test-[0-9]+-[0-9]+$ ]]; then
            echo "::error::Refusing to delete unexpected Docker continuity targets."
            exit 1
          fi

          delete_tag() {
            local image=$1
            local username=$2
            local delete_token=$3
            local namespace repository response auth_response access_token http_code check_code

            if [[ -z "$delete_token" ]]; then
              echo "::error::The owner-scoped delete token for $image is not configured."
              return 1
            fi

            namespace=${image%%/*}
            repository=${image#*/}
            if [[ "$namespace" != "$username" || "$repository" != d2 ]]; then
              echo "::error::Refusing mismatched Docker cleanup target $image for $username."
              return 1
            fi

            if ! auth_response=$(jq -nc \
              --arg identifier "$username" \
              --arg secret "$delete_token" \
              '{identifier: $identifier, secret: $secret}' | \
              curl -fsS --retry 2 --retry-all-errors \
                -H 'Content-Type: application/json' \
                --data-binary @- \
                https://hub.docker.com/v2/auth/token); then
              echo "::error::Docker Hub API authentication failed for $username."
              return 1
            fi
            if ! access_token=$(jq -er '.access_token' <<<"$auth_response"); then
              echo "::error::Docker Hub API did not return an access token for $username."
              return 1
            fi
            echo "::add-mask::$access_token"

            response="$RUNNER_TEMP/delete-${namespace}-${repository}.json"
            if ! http_code=$(curl -sS --retry 2 --retry-all-errors \
              -o "$response" \
              -w '%{http_code}' \
              --request DELETE \
              -H "Authorization: Bearer $access_token" \
              "https://hub.docker.com/v2/namespaces/$namespace/repositories/$repository/tags/$STAGE_TAG"); then
              echo "::error::Docker Hub cleanup request failed for $image:$STAGE_TAG."
              return 1
            fi
            case "$http_code" in
              202|204)
                echo "Deleted $image:$STAGE_TAG."
                ;;
              404)
                echo "$image:$STAGE_TAG was already absent."
                return 0
                ;;
              *)
                echo "::error::Docker Hub API cleanup returned HTTP $http_code for $image:$STAGE_TAG."
                return 1
                ;;
            esac

            for _ in 1 2 3 4 5; do
              check_code=$(curl -sS --retry 2 --retry-all-errors \
                -o /dev/null \
                -w '%{http_code}' \
                --head \
                -H "Authorization: Bearer $access_token" \
                "https://hub.docker.com/v2/namespaces/$namespace/repositories/$repository/tags/$STAGE_TAG") || return 1
              if [[ "$check_code" == 404 ]]; then
                echo "Verified $image:$STAGE_TAG is absent."
                return 0
              fi
              sleep 2
            done

            echo "::error::$image:$STAGE_TAG still exists after Docker Hub accepted the delete request."
            return 1
          }

          cleanup_failed=0
          delete_tag "$PRIMARY_DOCKER_IMAGE" d2lang \
            "$DOCKERHUB_D2LANG_DELETE_TOKEN" || cleanup_failed=1
          delete_tag "$LEGACY_DOCKER_IMAGE" terrastruct \
            "$DOCKERHUB_TERRASTRUCT_DELETE_TOKEN" || cleanup_failed=1
          exit "$cleanup_failed"

      - name: Clean up Docker credentials
        if: always()
        run: docker logout >/dev/null 2>&1 || true
