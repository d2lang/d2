name: ci
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_call:
permissions:
  actions: read
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - run: python3 -B ci/checks_test.py
      - id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 ci/checks.py plan

  native:
    permissions:
      actions: read
      attestations: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The shared CI helper walks history to find the formatting base.
          fetch-depth: 0
          filter: blob:none
      - name: Authenticate new installer checksum manifests
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          catalog=ci/release/checksums
          if ! git diff --quiet --no-renames --diff-filter=a "$BASE" HEAD -- "$catalog"; then
            echo "Existing installer checksum manifests must remain unchanged." >&2
            exit 1
          fi
          git diff --name-only -z --no-renames --diff-filter=A "$BASE" HEAD -- "$catalog" > "$RUNNER_TEMP/added-manifests"
          while IFS= read -r -d '' file; do
            if [[ ! $file =~ ^ci/release/checksums/(v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?)\.txt$ || ! -f $file || -L $file ]]; then
              printf 'Invalid installer checksum manifest: %q\n' "$file" >&2
              exit 1
            fi
            python3 ci/release/promote-checksums.py --version "${BASH_REMATCH[1]}" --check
          done < "$RUNNER_TEMP/added-manifests"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: ./go.mod
          cache: true
      - name: Install verified Pandoc formatter
        shell: bash
        run: |
          set -euo pipefail
          if command -v pandoc >/dev/null; then
            pandoc --version
            exit 0
          fi
          PANDOC_VERSION="3.14"
          PANDOC_DEB="$RUNNER_TEMP/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsSL \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb" \
            -o "$PANDOC_DEB"
          echo "dedb81f20345b76d7168ba551d90abceb707977fece789a79874094fe3833915  $PANDOC_DEB" \
            | sha256sum --check --strict
          sudo dpkg -i "$PANDOC_DEB"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Build the D2 formatter from this checkout
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/d2-ci-bin"
          go build -trimpath -o "$RUNNER_TEMP/d2-ci-bin/d2" .
          echo "$RUNNER_TEMP/d2-ci-bin" >> "$GITHUB_PATH"
      - run: COLOR=1 ./make.sh ci
        env:
          # Disable chat notifications from the shared CI helper.
          CI_MAKE_ROOT: "0"
          GITHUB_TOKEN: ${{ github.token }}
      - name: Test the MCP server with the race detector
        run: go test -race ./d2cli/ -run TestMCP
      - name: Build without the MCP server
        run: |
          go build -tags d2nomcp ./...
          go build -tags d2nomcp -o "$RUNNER_TEMP/d2nomcp" .
          if output=$("$RUNNER_TEMP/d2nomcp" mcp 2>&1); then exit 1; fi
          grep -F 'this build of d2 does not include the MCP server' <<< "$output"
      - name: Test TALA and geometry with the race detector
        run: go test -race ./d2layouts/d2talalayout/... ./internal/geomath -count=1 -timeout=15m
      - name: Test language server with the race detector
        run: go test -race ./d2lsp/lspserver -count=1
      - name: Test the dagre adapter with its TinyGo-only shadow maps compiled in
        run: go test -tags dagre_shadowmaps ./d2layouts/d2dagrelayout -count=1
      - name: Test TALA with the goroutine-free variants the WebAssembly module runs
        run: go test -tags scheduler.none ./d2layouts/d2talalayout/... -count=1 -timeout=15m
      - name: Test the sort callers with the TinyGo-only shared sorter compiled in
        run: go test -tags xsort_small ./lib/xsort ./lib/textmeasure ./d2ir ./d2lib ./d2renderers/d2fonts ./d2layouts/... ./e2etests -count=1 -timeout=30m
      - name: Verify representative release archive and size budget
        run: ./ci/release/build.sh --rebuild --run=linux/amd64 --version=v0.0.0-ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: d2chaos
          path: ./d2chaos/out
  windows-imports:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: ./go.mod
      - name: Test native and virtual import paths
        run: go test -v -run '^(TestImportRelativeToNativeInputPath|TestImportVirtualDirectoryWithBackslash|TestResolveImportPathOnWindows)$' ./d2ir ./lib/localfile
      - name: Test language server with native Windows paths
        run: go test ./d2lsp/lspserver -count=1
      - name: Test rooted MCP file input and diagnostics
        run: go test -v -run '^TestMCP(DiagramPaths|UTF16Diagram|Root)$' ./d2cli
      - name: Render a diagram from outside its directory
        run: go test -v -run '^TestCLI_E2E$/^import_from_another_directory$' ./e2etests-cli
  wasm:
    needs: select
    if: fromJSON(needs.select.outputs.jobs).wasm
    uses: ./.github/workflows/wasm.yml
  signed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Signature checks need the commit history and the shared CI scripts.
          fetch-depth: 0
          sparse-checkout: ci/sub
      - run: git submodule update --init
      - run: COLOR=1 ./ci/sub/bin/ensure_signed.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}

  archives:
    needs: select
    if: fromJSON(needs.select.outputs.jobs).archives
    uses: ./.github/workflows/archive-checks.yml
    with:
      full: ${{ fromJSON(needs.select.outputs.jobs).archives == 'full' }}

  browser:
    needs: select
    if: fromJSON(needs.select.outputs.jobs).browser
    uses: ./.github/workflows/browser-smoke.yml
    with:
      packed: ${{ fromJSON(needs.select.outputs.jobs).browser == 'packed' }}

  docker:
    needs: select
    if: fromJSON(needs.select.outputs.jobs).docker
    uses: ./.github/workflows/docker-image-smoke.yml

  fuzz:
    needs: select
    if: fromJSON(needs.select.outputs.jobs).fuzz
    uses: ./.github/workflows/tala-fuzz.yml

  windows-installer:
    needs: select
    if: fromJSON(needs.select.outputs.jobs)['windows-installer']
    uses: ./.github/workflows/windows-installer.yml

  # Keep the check name required by master. Only deliberately unselected jobs may skip.
  ci:
    if: always()
    needs: [select, native, signed, windows-imports, archives, browser, docker, fuzz, wasm, windows-installer]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: ci/checks.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Verify results against the selected jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 ci/checks.py verify
