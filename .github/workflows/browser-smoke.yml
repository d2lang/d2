name: Browser smoke
on:
  workflow_call:
    inputs:
      packed:
        description: Build and test the packed JavaScript library.
        type: boolean
        required: true
permissions:
  contents: read

jobs:
  browsers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: ./go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install the WASM toolchain
        if: inputs.packed
        run: ./ci/install-wasm-tools.sh
      - name: Build the JavaScript distribution
        if: inputs.packed
        run: ./d2js/js/make.sh build
        env:
          GIT_BASE: HEAD
      - uses: ./.github/actions/browser-smoke
        with:
          packed: ${{ inputs.packed && 'true' || 'false' }}
