name: Release archives

on:
  push:
    tags:
      - v*

permissions:
  contents: read

concurrency:
  group: release-archives-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    permissions:
      actions: read
      attestations: read
      contents: read
    uses: ./.github/workflows/ci.yml

  archives:
    uses: ./.github/workflows/archive-checks.yml
    with:
      full: true

  attest:
    if: github.event_name == 'push' && github.ref_type == 'tag' && github.repository == 'd2lang/d2'
    needs: [archives, tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-archives
          path: ${{ runner.temp }}/release-archives
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-debs
          path: ${{ runner.temp }}/release-debs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-rpms
          path: ${{ runner.temp }}/release-rpms
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-sbom
          path: ${{ runner.temp }}/release-sbom

      - name: Attest archive and Linux package build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/release-archives/*.tar.gz
            ${{ runner.temp }}/release-debs/*.deb
            ${{ runner.temp }}/release-rpms/*.rpm

      - name: Stage the release provenance bundle
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          VERSION: ${{ needs.archives.outputs.version }}
        run: cp "$BUNDLE" "$RUNNER_TEMP/d2-$VERSION-provenance.sigstore.json"

      - name: Upload release provenance bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-provenance
          path: ${{ runner.temp }}/d2-${{ needs.archives.outputs.version }}-provenance.sigstore.json
          if-no-files-found: error
          retention-days: 30

      - name: Attest archive SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release-archives/*.tar.gz
          sbom-path: ${{ runner.temp }}/release-sbom/d2.spdx.json

      - name: Attest checksum manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release-archives/SHA256SUMS

  draft:
    if: github.event_name == 'push' && github.ref_type == 'tag' && github.repository == 'd2lang/d2'
    needs: [archives, tests, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.archives.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-archives
          path: ${{ runner.temp }}/release-archives
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-debs
          path: ${{ runner.temp }}/release-debs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-rpms
          path: ${{ runner.temp }}/release-rpms
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-msi
          path: ${{ runner.temp }}/windows-msi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-sbom
          path: ${{ runner.temp }}/release-sbom
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-provenance
          path: ${{ runner.temp }}/release-provenance
      - name: Verify archive and Linux package provenance before publishing
        env:
          VERSION: ${{ needs.archives.outputs.version }}
          COMMIT: ${{ needs.archives.outputs.commit }}
        run: |
          set -euo pipefail
          . ./ci/release/checksum.sh
          . ./ci/release/verifier.sh
          verifier=$(installer_gh "$(mktemp -d)")
          bundle="$RUNNER_TEMP/release-provenance/d2-$VERSION-provenance.sigstore.json"
          for artifact in "$RUNNER_TEMP"/release-archives/*.tar.gz "$RUNNER_TEMP"/release-debs/*.deb "$RUNNER_TEMP"/release-rpms/*.rpm; do
            "$verifier" attestation verify "$artifact" --bundle "$bundle" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-archives.yml" \
              --source-ref "refs/tags/$VERSION" --source-digest "$COMMIT"
          done
      - name: Attach verified artifacts to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.archives.outputs.version }}
          RELEASE_COMMIT: ${{ needs.archives.outputs.commit }}
        run: |
          python3 ci/release/upload-draft.py \
            --repository "$GITHUB_REPOSITORY" --version "$VERSION" --commit "$RELEASE_COMMIT" \
            --archives "$RUNNER_TEMP/release-archives" \
            --debs "$RUNNER_TEMP/release-debs" \
            --rpms "$RUNNER_TEMP/release-rpms" \
            --msi "$RUNNER_TEMP/windows-msi/d2-$VERSION-windows-amd64.msi" \
            --sbom "$RUNNER_TEMP/release-sbom/d2.spdx.json" \
            --provenance "$RUNNER_TEMP/release-provenance/d2-$VERSION-provenance.sigstore.json"
